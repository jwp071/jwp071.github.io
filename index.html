<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jeff Pettyjohn</title>
  <meta name="description" content="Jeff Pettyjohn's corner of the internet. The dot after the name is a ball: pull it back and aim at the drone.">
  <meta name="theme-color" content="#1b2f4f">
  <link rel="canonical" href="https://jeffpettyjohn.com/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jeffpettyjohn.com/">
  <meta property="og:title" content="Jeff Pettyjohn">
  <meta property="og:description" content="The dot after the name is a ball. Pull it back and aim at the drone.">
  <meta property="og:image" content="https://jeffpettyjohn.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preload" href="/assets/fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/site.css">
  <noscript><style>.sr { position: static; width: auto; height: auto; clip-path: none; font: 400 clamp(3rem, 16vw, 11rem)/.95 Anton, Impact, sans-serif; text-transform: uppercase; padding: 14vh 6vw 0; }</style></noscript>
</head>
<body data-state="idle">
  <canvas id="floor" aria-hidden="true"></canvas>
  <canvas id="court" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <h1 class="sr">Jeff Pettyjohn</h1>
    <div class="info" id="info">
      <p class="lede">I build software. The dot after my name is a ball: pull back, aim at the drone, let go.</p>
      <ul class="links">
        <li><a id="email" data-u="jeff" data-d="jeffpettyjohn.com" href="#info">Email<noscript>: jeff [at] jeffpettyjohn.com</noscript></a></li>
        <li><a href="https://github.com/jwp071/" rel="me noopener" target="_blank">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/jeffpettyjohn/" rel="me noopener" target="_blank">LinkedIn</a></li>
      </ul>
      <p class="note">Friendly greetings and funny jokes welcome.</p>
    </div>
  </main>

  <div class="hud" id="hud">
    <div class="hud-score">
      <span class="num" id="score">0</span>
      <span class="unit" id="ballname">Basketball</span>
    </div>
    <div class="hud-side">
      <span class="strikes" id="strikes" role="img" aria-label="0 of 3 strikes"><i></i><i></i><i></i></span>
      <span class="stat">best <b id="best">–</b></span>
      <button id="mute" type="button" aria-pressed="false">Sound on</button>
    </div>
  </div>

  <section class="over" id="over" aria-labelledby="over-title">
    <p class="eyebrow" id="over-title">Three strikes</p>
    <p class="result"><span class="num" id="over-score">0</span> <span class="unit" id="over-unit">points</span></p>
    <p class="detail" id="over-best"></p>
    <div class="over-btns">
      <button class="btn main" id="again" type="button">Play again</button>
      <button class="btn" id="share" type="button">Challenge a friend</button>
    </div>
  </section>

  <script defer src="/assets/game.js"></script>
</body>
</html>
